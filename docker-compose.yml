services:
  backend:
    build:
      context: ./backend
    container_name: nse-swing-scanner-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: nse-swing-scanner-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
